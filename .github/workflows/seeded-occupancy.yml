name: Kalyna independently-seeded occupancy replication
on:
  push:
    branches:
      - npj-optimized-oracle-audit-20261121
    paths:
      - '.github/workflows/seeded-occupancy.yml'
      - 'validation/reference_oracle_multiplicity_seeded.c'
      - 'validation/seeded_occupancy_replicate.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  occupancy-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact binomial-test dependency
        run: python -m pip install scipy
      - name: Fetch pinned official Kalyna reference
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Roman-Oliynykov/Kalyna-reference.git /tmp/Kalyna-reference
          git -C /tmp/Kalyna-reference checkout 22eafbcaf6635dc5e1f8a734b1f7c5ab84b5a5ea
      - name: Compile seeded genuine-Kalyna scanner
        shell: bash
        run: |
          gcc -O3 -std=c11 -Wall -Wextra -I/tmp/Kalyna-reference \
            validation/reference_oracle_multiplicity_seeded.c \
            /tmp/Kalyna-reference/kalyna.c /tmp/Kalyna-reference/tables.c \
            -o validation/kalyna_multiplicity_seeded
      - name: Run two-seed occupancy replication
        shell: bash
        run: |
          PYTHONPATH=. python validation/seeded_occupancy_replicate.py \
             --scanner ./validation/kalyna_multiplicity_seeded \
             --trials-per-seed 256 --unknown-bits 12,14,16 \
             --outdir outputs/seeded_occupancy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalyna-seeded-occupancy
          path: outputs/seeded_occupancy/
          if-no-files-found: warn
