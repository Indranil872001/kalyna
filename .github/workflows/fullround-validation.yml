name: Kalyna full-round validation

on:
  push:
    branches:
      - fullround-validation-v1
      - npj-oracle-multiplicity-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout manuscript code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch pinned official Kalyna reference
        run: |
          set -euxo pipefail
          git clone https://github.com/Roman-Oliynykov/Kalyna-reference.git /tmp/Kalyna-reference
          git -C /tmp/Kalyna-reference checkout 22eafbcaf6635dc5e1f8a734b1f7c5ab84b5a5ea
          test "$(git -C /tmp/Kalyna-reference rev-parse HEAD)" = "22eafbcaf6635dc5e1f8a734b1f7c5ab84b5a5ea"

      - name: Compile independent full-round scanners
        run: |
          set -euxo pipefail
          gcc -O3 -std=c11 -Wall -Wextra -I/tmp/Kalyna-reference             validation/reference_sparse_scan.c             /tmp/Kalyna-reference/kalyna.c /tmp/Kalyna-reference/tables.c             -o validation/kalyna_scan
          gcc -O3 -std=c11 -Wall -Wextra -I/tmp/Kalyna-reference             validation/reference_oracle_multiplicity.c             /tmp/Kalyna-reference/kalyna.c /tmp/Kalyna-reference/tables.c             -o validation/kalyna_multiplicity_scan

      - name: Check local reversible components and cleanup
        run: |
          set -euxo pipefail
          python validation/check_local_cleanup.py

      - name: Run extended full-round restricted-key Grover validation
        run: |
          set -euxo pipefail
          python validation/run_fullround_sparse.py             --scanner ./validation/kalyna_scan             --unknown-bits 8,10,12,14,16,18,20             --include-minimal

      - name: Run full-round oracle-multiplicity experiment
        run: |
          set -euxo pipefail
          python validation/run_oracle_multiplicity.py             --scanner ./validation/kalyna_multiplicity_scan             --unknown-bits 16             --trials 32

      - name: Recompute corrected logical resource tables
        run: |
          set -euxo pipefail
          python validation/corrected_resource_counts.py

      - name: Install depth-audit dependency
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Remeasure corrected dependency depths
        env:
          PYTHONPATH: validation/projectq_stub
        run: |
          set -euxo pipefail
          mkdir -p outputs/fullround_validation
          python validation/depth_128_corrected.py             | tee outputs/fullround_validation/depth_128_corrected.txt
          {
            echo "=== 128/256 encryption core ==="
            python kalyna_key_256 --mode enc
            echo "=== 128/256 key schedule ==="
            python kalyna_key_256 --mode ks
            echo "=== 128/256 full ==="
            python kalyna_key_256 --mode full
          } | tee outputs/fullround_validation/depth_256_corrected.txt

      - name: Record immutable provenance
        run: |
          set -euxo pipefail
          mkdir -p outputs/fullround_validation
          {
            echo "kalyna_repo_commit=$(git rev-parse HEAD)"
            echo "official_reference_commit=$(git -C /tmp/Kalyna-reference rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            echo "gcc=$(gcc --version | head -1)"
            echo "depth_backend=validation/projectq_stub"
          } > outputs/fullround_validation/provenance.txt
          find outputs -type f -print0 | sort -z | xargs -0 sha256sum > outputs/SHA256SUMS.txt
          cat outputs/fullround_validation/fullround_sparse_report.md
          cat outputs/oracle_multiplicity/oracle_multiplicity_report.md
          cat outputs/fullround_validation/depth_128_corrected.txt
          cat outputs/fullround_validation/depth_256_corrected.txt
          cat outputs/fullround_validation/provenance.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: kalyna-npj-validation
          path: outputs/
          if-no-files-found: error
